<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmaa - Finance</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>TRANSMAA</h1>
        <button class="help-btn"
                onclick="alert('Enter your finance details.')">
            ?
        </button>
    </header>

    <main>

        <h2>Vehicle Finance</h2>

        <div class="form-section">

            <label>Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter phone number">

            <label>Type of Vehicle</label>
            <input type="text" placeholder="Enter vehicle type">

            <label>RC Number</label>
            <input type="text" placeholder="Enter RC number">

            <label>Loan Amount</label>
            <input type="number" placeholder="Enter loan amount">

            <button class="submit-btn"
                    onclick="window.location.href='success.html'">
                Submit
            </button>

        </div>

    </main>

</div>

</body>
</html>
